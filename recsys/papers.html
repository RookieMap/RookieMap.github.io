<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>推荐系统论文阅读指南</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f7f8f6;--surface:#ffffff;--text:#202421;--muted:#667069;--line:#dfe4df;
      --accent:#176b4d;--accent-soft:#e7f2ec;--must:#b43b32;--must-soft:#f8e9e7;
      --focus:#9a6700;--focus-soft:#f7efd9;--explore:#3168a2;--explore-soft:#e8f0f8;
      --shadow:0 1px 2px rgba(25,35,29,.06);--radius:7px;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#161918;--surface:#1d211f;--text:#eef2ef;--muted:#a4aea7;--line:#343b37;
      --accent:#77c6a3;--accent-soft:#203c30;--must:#f09a91;--must-soft:#452825;
      --focus:#e8c46b;--focus-soft:#453a20;--explore:#8cb9e7;--explore-soft:#253a50;
      --shadow:none;
    }}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;letter-spacing:0;line-height:1.65}
    button,input,select{font:inherit;letter-spacing:0}
    button,input,select,a{outline-offset:3px}
    a{color:inherit}
    .site-header{border-bottom:1px solid var(--line);background:var(--surface)}
    .header-inner,.toolbar-inner,.content{width:min(1180px,calc(100% - 40px));margin:0 auto}
    .header-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:34px 0 28px}
    h1{margin:0;font-size:30px;font-weight:500;line-height:1.25;letter-spacing:0}
    .subtitle{margin:8px 0 0;color:var(--muted)}
    .summary{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
    .summary-item{min-width:72px}
    .summary-value{display:block;font-size:22px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
    .summary-label{color:var(--muted);font-size:12px}
    .toolbar{position:sticky;z-index:10;top:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px)}
    .toolbar-inner{display:grid;grid-template-columns:minmax(240px,1.25fr) minmax(220px,1fr) auto auto;gap:12px;align-items:end;padding:14px 0}
    .field{display:grid;gap:4px;min-width:0;color:var(--muted);font-size:12px}
    .control{width:100%;height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
    .segments{display:flex;height:40px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
    .segment{min-width:58px;padding:0 11px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
    .segment:last-child{border-right:0}
    .segment[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
    .reset{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
    .segment:hover,.reset:hover{background:var(--accent-soft);color:var(--accent)}
    .content{padding:24px 0 60px}
    .result-line{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;color:var(--muted);font-size:13px}
    .legend{display:flex;gap:16px;flex-wrap:wrap}
    .legend-item{display:inline-flex;align-items:center;gap:6px}
    .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
    .dot.must{color:var(--must)}.dot.focus{color:var(--focus)}.dot.explore{color:var(--explore)}
    .direction{margin:0 0 34px;scroll-margin-top:96px}
    .direction-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:0 0 10px;border-bottom:2px solid var(--text)}
    .direction-title{margin:0;font-size:19px;font-weight:500;line-height:1.35;letter-spacing:0}
    .direction-description{margin:4px 0 0;color:var(--muted);font-size:13px}
    .direction-count{color:var(--muted);font-size:13px;white-space:nowrap}
    .paper{display:grid;grid-template-columns:52px minmax(0,1fr);gap:15px;padding:17px 8px 17px 0;border-bottom:1px solid var(--line)}
    .paper:hover{background:color-mix(in srgb,var(--accent-soft) 38%,transparent)}
    .paper-rank{padding-top:2px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
    .paper-main{min-width:0}
    .paper-topline{display:flex;align-items:flex-start;gap:10px}
    .priority{flex:0 0 auto;margin-top:2px;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;line-height:1.7;white-space:nowrap}
    .priority-5{color:var(--must);background:var(--must-soft)}
    .priority-4{color:var(--focus);background:var(--focus-soft)}
    .priority-3{color:var(--explore);background:var(--explore-soft)}
    .paper-title{font-size:15px;font-weight:500;line-height:1.45;text-decoration-color:color-mix(in srgb,var(--text) 30%,transparent);text-underline-offset:3px;overflow-wrap:anywhere}
    .paper-title:hover{color:var(--accent);text-decoration-color:var(--accent)}
    .paper-meta{margin-top:5px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    .paper-reason{margin-top:7px;font-size:13px}
    .paper-reason-label{color:var(--muted);font-weight:500}
    .empty{padding:72px 16px;text-align:center;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .footer{padding:18px 0 30px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    .footer .content{padding:0}
    [hidden]{display:none!important}
    @media(max-width:900px){
      .header-inner{align-items:flex-start;flex-direction:column}.summary{justify-content:flex-start}
      .toolbar-inner{grid-template-columns:1fr 1fr}.priority-field,.reset{align-self:end}
    }
    @media(max-width:620px){
      .header-inner,.toolbar-inner,.content{width:min(100% - 28px,1180px)}
      .header-inner{padding:24px 0 20px}h1{font-size:25px}.summary{gap:14px 24px}
      .toolbar{position:static}.toolbar-inner{grid-template-columns:1fr;padding:12px 0}
      .priority-field,.reset{width:100%}.segments{display:grid;grid-template-columns:repeat(4,1fr)}
      .segment{min-width:0;padding:0 4px}.content{padding-top:18px}.result-line{align-items:flex-start;flex-direction:column}
      .direction-header{grid-template-columns:1fr}.direction-count{display:none}
      .paper{grid-template-columns:36px minmax(0,1fr);gap:10px;padding-right:0}.paper-topline{align-items:flex-start;flex-direction:column;gap:5px}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1>推荐系统论文阅读指南</h1>
        <p class="subtitle">面向新人的分方向阅读清单</p>
      </div>
      <div class="summary" aria-label="阅读优先级统计">
        <div class="summary-item"><span class="summary-value">106</span><span class="summary-label">收录论文</span></div>
        <div class="summary-item"><span class="summary-value">20</span><span class="summary-label">必读</span></div>
        <div class="summary-item"><span class="summary-value">21</span><span class="summary-label">重点阅读</span></div>
        <div class="summary-item"><span class="summary-value">65</span><span class="summary-label">拓展阅读</span></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <label class="field" for="search">搜索论文、作者、会议或关键词
        <input class="control" id="search" type="search" placeholder="例如：矩阵分解、SIGIR、因果">
      </label>
      <label class="field" for="category">研究方向
        <select class="control" id="category"><option value="all">全部方向</option></select>
      </label>
      <div class="field priority-field">
        <span>阅读优先级</span>
        <div class="segments" id="priority-filter" aria-label="阅读优先级筛选">
          <button class="segment" type="button" data-priority="all" aria-pressed="true">全部</button>
          <button class="segment" type="button" data-priority="5" aria-pressed="false">必读</button>
          <button class="segment" type="button" data-priority="4" aria-pressed="false">重点</button>
          <button class="segment" type="button" data-priority="3" aria-pressed="false">拓展</button>
        </div>
      </div>
      <button class="reset" id="reset" type="button">重置</button>
    </div>
  </div>

  <main class="content">
    <div class="result-line">
      <span id="result-count" aria-live="polite">当前显示 106 篇</span>
      <div class="legend" aria-label="优先级说明">
        <span class="legend-item"><span class="dot must"></span>必读</span>
        <span class="legend-item"><span class="dot focus"></span>重点阅读</span>
        <span class="legend-item"><span class="dot explore"></span>拓展阅读</span>
      </div>
    </div>
    <div id="paper-list"></div>
    <div class="empty" id="empty" hidden>没有符合当前条件的论文。</div>
  </main>

  <footer class="footer"><div class="content">清单版本：2026-07 · DOI / arXiv 链接与规范化标题去重 · 可离线使用</div></footer>
  <script id="guide-data" type="application/json">{"categories":[{"id":"evaluation","name":"导论、数据集与评测方法","description":"建立领域地图，理解数据、指标、实验设计与可复现性。"},{"id":"classic-cf","name":"协同过滤与经典推荐系统","description":"从邻域方法和早期系统理解推荐问题的基本形式。"},{"id":"matrix-ranking","name":"矩阵分解、隐因子与排序学习","description":"掌握隐式反馈、低秩表示与个性化排序的经典主线。"},{"id":"context-ctr","name":"内容、上下文、特征交互与 CTR","description":"理解侧信息、稀疏特征交互和点击率预估模型。"},{"id":"deep-ssl","name":"深度推荐与自监督学习","description":"观察深度表征学习如何进入协同过滤与推荐建模。"},{"id":"sequential","name":"序列推荐与会话推荐","description":"围绕行为顺序、短期意图和长期兴趣建模。"},{"id":"graph-kg","name":"图推荐与知识图谱","description":"学习用户物品图、图卷积和知识增强推荐。"},{"id":"multimodal","name":"多模态推荐","description":"融合图像、文本、音频及其结构关系。"},{"id":"industry","name":"召回、排序与工业系统","description":"连接候选生成、向量检索、排序模型与大规模服务。"},{"id":"bandit-rl","name":"Bandit、强化学习与多目标优化","description":"处理探索利用、长期收益、列表决策和重排。"},{"id":"causal-debias","name":"去偏、因果与反事实学习","description":"识别曝光、选择与位置偏差，学习可靠评估与优化。"},{"id":"responsible","name":"多样性、公平、解释、隐私与鲁棒性","description":"覆盖准确率之外的用户价值、责任与系统风险。"},{"id":"generative","name":"生成式推荐、LLM 与智能体","description":"跟踪生成式检索、语言模型推荐与智能体系统。"}],"papers":[{"id":"evaluatingcollaborativefilteringrecommen","title":"Evaluating collaborative filtering recommender systems","url":"https://doi.org/10.1145/963770.963772","meta":"Jonathan L. Herlocker; Joseph A. Konstan; Loren Terveen; John Riedl，2004，ACM Transactions on Information Systems · 评测/资源","reason":"系统讨论准确率之外的覆盖率、新颖性等指标，形成离线评测的重要基础。","year":2004,"priority":5,"category":"evaluation","duplicateCount":2},{"id":"arewereallymakingmuchprogressaworryingan","title":"Are we really making much progress? A worrying analysis of recent neural recommendation approaches","url":"https://doi.org/10.1145/3298689.3347058","meta":"Maurizio Ferrari Dacrema; Paolo Cremonesi; Dietmar Jannach，2019，RecSys · 评测/资源","reason":"复现多种神经推荐模型后发现经典基线常被低估，促使领域重新审视实验规范。","year":2019,"priority":5,"category":"evaluation","duplicateCount":2},{"id":"onsampledmetricsforitemrecommendation","title":"On Sampled Metrics for Item Recommendation","url":"https://doi.org/10.1145/3394486.3403226","meta":"Krichene & Rendle，2020，KDD","reason":"它证明在采样候选集上计算的指标通常不保持全量排序关系，是设计离线实验前必须读的警示。","year":2020,"priority":5,"category":"evaluation","duplicateCount":1},{"id":"neuralcollaborativefilteringvsmatrixfact","title":"Neural Collaborative Filtering vs. Matrix Factorization Revisited","url":"https://doi.org/10.1145/3383313.3412488","meta":"Rendle et al.，2020，RecSys","reason":"与 NCF 对照阅读，理解损失函数、负采样和优化细节为何常比网络结构本身更关键。","year":2020,"priority":4,"category":"evaluation","duplicateCount":1},{"id":"beingaccurateisnotenoughhowaccuracymetri","title":"Being Accurate Is Not Enough: How Accuracy Metrics Have Hurt Recommender Systems","url":"https://doi.org/10.1145/1125451.1125659","meta":"McNee et al.，2006，CHI EA","reason":"它迫使你追问“更准确是否真的更有用”，是从单一准确率走向体验、发现性和多样性的认知转折。","year":2006,"priority":3,"category":"evaluation","duplicateCount":1},{"id":"asurveyofaccuracyevaluationmetricsofreco","title":"A Survey of Accuracy Evaluation Metrics of Recommendation Tasks","url":"https://www.jmlr.org/papers/v10/gunawardana09a.html","meta":"Gunawardana & Shani，2009，JMLR","reason":"系统理解评分预测、分类和 Top-N 任务为何需要不同指标，以及 MAE、RMSE、Precision、Recall 等指标各自遗漏了什么。","year":2009,"priority":3,"category":"evaluation","duplicateCount":1},{"id":"controlledexperimentsonthewebsurveyandpr","title":"Controlled Experiments on the Web: Survey and Practical Guide","url":"https://doi.org/10.1007/s10618-008-0114-1","meta":"Kohavi et al.，2009，Data Mining and Knowledge Discovery","reason":"补齐线上 A/B 实验的随机化、方差、触发分析和常见陷阱，让你知道离线收益如何接受产品检验。","year":2009,"priority":3,"category":"evaluation","duplicateCount":1},{"id":"performanceofrecommenderalgorithmsontopn","title":"Performance of recommender algorithms on top-n recommendation tasks","url":"https://doi.org/10.1145/1864708.1864721","meta":"Paolo Cremonesi; Yehuda Koren; Roberto Turrin，2010，RecSys · 评测/资源","reason":"指出评分预测优劣不能直接代表Top-N效果，推动研究采用面向排序的评测。","year":2010,"priority":3,"category":"evaluation","duplicateCount":2},{"id":"usingcollaborativefilteringtoweaveaninfo","title":"Using Collaborative Filtering to Weave an Information Tapestry","url":"https://doi.org/10.1145/138859.138867","meta":"Goldberg et al.，1992，Communications of the ACM","reason":"回到协同过滤概念的源头，理解推荐最初是在解决信息过载与人工过滤协作，而不是单纯预测评分。","year":1992,"priority":5,"category":"classic-cf","duplicateCount":1},{"id":"itembasedcollaborativefilteringrecommend","title":"Item-based collaborative filtering recommendation algorithms","url":"https://doi.org/10.1145/371920.372071","meta":"Badrul Sarwar; George Karypis; Joseph A. Konstan; John Riedl，2001，WWW · 方法","reason":"确立基于物品邻域的协同过滤范式，长期作为工业召回和学术基线。","year":2001,"priority":5,"category":"classic-cf","duplicateCount":2},{"id":"amazoncomrecommendationsitemtoitemcollab","title":"Amazon.com recommendations: item-to-item collaborative filtering","url":"https://doi.org/10.1109/mic.2003.1167344","meta":"Greg Linden; Brent Smith; Jeremy York，2003，IEEE Internet Computing · 方法","reason":"公开解释亚马逊物品到物品协同过滤，连接了经典算法与超大规模电商实践。","year":2003,"priority":5,"category":"classic-cf","duplicateCount":2},{"id":"fabcontentbasedcollaborativerecommendati","title":"Fab: Content-Based, Collaborative Recommendation","url":"https://doi.org/10.1145/245108.245124","meta":"Marko Balabanovic; Yoav Shoham，1997，Communications of the ACM · 方法","reason":"早期把内容表示与协同过滤结合，展示了混合推荐能够缓解单一信号不足。","year":1997,"priority":4,"category":"classic-cf","duplicateCount":2},{"id":"grouplensanopenarchitectureforcollaborat","title":"GroupLens: An Open Architecture for Collaborative Filtering of Netnews","url":"https://doi.org/10.1145/192844.192905","meta":"Resnick et al.，1994，CSCW","reason":"早期 user-based CF 的完整系统论文，把评分、邻居算法和真实社区部署连接起来。","year":1994,"priority":3,"category":"classic-cf","duplicateCount":1},{"id":"empiricalanalysisofpredictivealgorithmsf","title":"Empirical Analysis of Predictive Algorithms for Collaborative Filtering","url":"https://arxiv.org/abs/1301.7363","meta":"John S. Breese; David Heckerman; Carl Kadie，1998   <script>
    (function(){
      "use strict";
      var data=JSON.parse(document.getElementById("guide-data").textContent);
      var state={query:"",category:"all",priority:"all"};
      var labels={5:"必读",4:"重点阅读",3:"拓展阅读"};
      var search=document.getElementById("search");
      var category=document.getElementById("category");
      var priorityFilter=document.getElementById("priority-filter");
      var list=document.getElementById("paper-list");
      var empty=document.getElementById("empty");
      var resultCount=document.getElementById("result-count");
      var reset=document.getElementById("reset");

      function normalize(value){return String(value||"").toLocaleLowerCase("zh-CN")}
      function element(tag,className,text){
        var node=document.createElement(tag);
        if(className)node.className=className;
        if(text!==undefined)node.textContent=text;
        return node;
      }
      function paperNode(paper,rank){
        var article=element("article","paper");
        article.dataset.priority=String(paper.priority);
        var number=element("div","paper-rank",String(rank).padStart(2,"0"));
        var main=element("div","paper-main");
        var top=element("div","paper-topline");
        var priority=element("span","priority priority-"+paper.priority,labels[paper.priority]);
        var link=element("a","paper-title",paper.title+" ↗");
        link.href=paper.url;link.target="_blank";link.rel="noopener noreferrer";
        top.appendChild(priority);top.appendChild(link);
        var meta=element("div","paper-meta",paper.meta);
        var reason=element("div","paper-reason");
        reason.appendChild(element("span","paper-reason-label","为什么读："));
        reason.appendChild(document.createTextNode(paper.reason));
        main.appendChild(top);main.appendChild(meta);main.appendChild(reason);
        article.appendChild(number);article.appendChild(main);
        return article;
      }
      function visiblePapers(){
        var query=normalize(state.query).trim();
        return data.papers.filter(function(paper){
          if(state.category!=="all"&&paper.category!==state.category)return false;
          if(state.priority!=="all"&&paper.priority!==Number(state.priority))return false;
          if(!query)return true;
          return normalize([paper.title,paper.meta,paper.reason].join(" ")).indexOf(query)>=0;
        });
      }
      function render(){
        var visible=visiblePapers();
        var fragment=document.createDocumentFragment();
        data.categories.forEach(function(direction){
          var papers=visible.filter(function(paper){return paper.category===direction.id});
          if(!papers.length)return;
          var section=element("section","direction");
          section.id="direction-"+direction.id;
          var header=element("header","direction-header");
          var headingWrap=element("div");
          headingWrap.appendChild(element("h2","direction-title",direction.name));
          headingWrap.appendChild(element("p","direction-description",direction.description));
          header.appendChild(headingWrap);
          header.appendChild(element("span","direction-count",papers.length+" 篇"));
          section.appendChild(header);
          papers.forEach(function(paper,index){section.appendChild(paperNode(paper,index+1))});
          fragment.appendChild(section);
        });
        list.replaceChildren(fragment);
        empty.hidden=visible.length!==0;
        resultCount.textContent="当前显示 "+visible.length+" 篇";
      }
      data.categories.forEach(function(direction){
        var count=data.papers.filter(function(paper){return paper.category===direction.id}).length;
        if(!count)return;
        var option=document.createElement("option");
        option.value=direction.id;option.textContent=direction.name+"（"+count+"）";
        category.appendChild(option);
      });
      search.addEventListener("input",function(){state.query=search.value;render()});
      category.addEventListener("change",function(){state.category=category.value;render()});
      priorityFilter.addEventListener("click",function(event){
        var button=event.target.closest("button[data-priority]");
        if(!button)return;
        state.priority=button.dataset.priority;
        priorityFilter.querySelectorAll("button").forEach(function(item){item.setAttribute("aria-pressed",String(item===button))});
        render();
      });
      reset.addEventListener("click",function(){
        state={query:"",category:"all",priority:"all"};
        search.value="";category.value="all";
        priorityFilter.querySelectorAll("button").forEach(function(item){item.setAttribute("aria-pressed",String(item.dataset.priority==="all"))});
        render();
      });
      render();
    })();
  </script>
</body>
</html>
